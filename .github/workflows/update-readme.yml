name: Update README

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정에만 실행
  workflow_dispatch:  # 수동 실행만 가능

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        
      - name: Update recent activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 